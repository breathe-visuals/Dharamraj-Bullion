<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dharamraj Silver Arts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Live bullion rates</p>
      <h1>Dharamraj Silver Arts</h1>
      <p class="subtitle">Live market rates, updated instantly.</p>

      <div class="hero-meta">
        <div id="status" class="status">Connecting…</div>
        <div id="lastUpdated" class="last-updated">Last updated: —</div>
      </div>
    </header>

    <section class="summary-panel">
      <div class="section-head">
        <div>
          <h2>Product Slider</h2>
          <p>Swipe on mobile to switch between silver and gold product tables.</p>
        </div>

        <div class="summary-tabs" role="tablist" aria-label="Product slider">
          <button class="summary-tab active" data-target="silverCard" type="button">Silver</button>
          <button class="summary-tab" data-target="goldCard" type="button">Gold</button>
        </div>
      </div>

      <article class="summary-card silver-card" id="silverCard">
  <div class="summary-top">
    <span class="chip chip-silver">Silver Products</span>
  </div>

  <div class="summary-value"></div>
  <div class="summary-sub"></div>

  <div class="mini-table-wrap" id="silverProductsBox"></div>
</article>

        <article class="summary-card gold-card" id="goldCard">
  <div class="summary-top">
    <span class="chip chip-gold">Gold Products</span>
  </div>

  <div class="summary-value"></div>
  <div class="summary-sub"></div>

  <div class="mini-table-wrap" id="goldProductsBox"></div>
</article>

    <section class="grid">
      <article class="card">
        <div class="card-head">
          <h2>Future Rates</h2>
          <span class="muted">Live future feed</span>
        </div>
        <div id="futureBox" class="live-box"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h2>Spot Rates</h2>
          <span class="muted">Live spot feed</span>
        </div>
        <div id="spotBox" class="live-box"></div>
      </article>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
