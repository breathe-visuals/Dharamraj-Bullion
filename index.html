<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dharamraj Silver Arts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="Media/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="Media/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="Media/favicon-16x16.png">
  <link rel="manifest" href="Media/site.webmanifest">
  <link rel="shortcut icon" href="Media/favicon.ico">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div style="text-align: center;">
        <img src="Media/Dharamraj_Logo-1000x1000.png" alt="Dharamraj Logo" style="width: 160px; height: auto; margin-bottom: 8px;" />
        <p class="subtitle" style="margin-top: 0;">Live market rates, updated instantly.</p>
      </div>

      <div class="hero-meta" style="justify-content: center;">
        <div id="status" class="status">Connecting…</div>
        <div id="lastUpdated" class="last-updated">Last updated: —</div>
      </div>
    </header>

    <section class="summary-panel">
      <div class="section-head">
        <div>
          <h2>Products</h2>
          <p>Live silver and gold product rates.</p>
        </div>
      </div>

      <div class="grid">
        <article class="summary-card silver-card" id="silverCard">
          <div class="summary-top">
            <span class="chip chip-silver">Silver Products</span>
          </div>
          <div class="mini-table-wrap" id="silverProductsBox"></div>
        </article>

        <article class="summary-card gold-card" id="goldCard">
          <div class="summary-top">
            <span class="chip chip-gold">Gold Products</span>
          </div>
          <div class="mini-table-wrap" id="goldProductsBox"></div>
        </article>
      </div>

    <section class="grid">
      <article class="card">
        <div class="card-head">
          <h2>Future Rates</h2>
          <span class="muted">Live future feed</span>
        </div>
        <div id="futureBox" class="live-box"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h2>Spot Rates</h2>
          <span class="muted">Live spot feed</span>
        </div>
        <div id="spotBox" class="live-box"></div>
      </article>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
