<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a192f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dharamraj" />
  <meta name="description" content="Live gold and silver bullion rates, updated instantly." />

  <title>Live Rates</title>

  <!-- Icons & Manifest -->
  <link rel="icon" href="Media/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="Media/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="Media/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="Media/apple-touch-icon.png" />
  <link rel="manifest" href="Media/site.webmanifest" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <img src="Media/Dharamraj_Logo-1000x1000.png" alt="Logo" class="header-logo" />
      <div class="header-right">
        <span id="status" class="status-dot" title="Connection status"></span>
        <div id="lastUpdated" class="last-updated">—</div>
      </div>
    </div>
  </header>

  <main class="page">

    <!-- PRODUCT SLIDER SECTION -->
    <section class="section" aria-label="Product Rates">
      <div class="section-label">
        <span class="section-title">Product Rates</span>
        <div class="slider-dots" aria-hidden="true" id="productDots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="slider-track" id="productSlider">
        <!-- Silver Card -->
        <article class="slider-card" id="silverCard">
          <div class="card-header">
            <h2 class="card-title">Silver Products</h2>
          </div>
          <div class="table-wrap no-scroll" id="silverProductsBox">
            <p class="empty-msg">Connecting to live feed…</p>
          </div>
        </article>

        <!-- Gold Card -->
        <article class="slider-card" id="goldCard">
          <div class="card-header">
            <h2 class="card-title">Gold Products</h2>
          </div>
          <div class="table-wrap no-scroll" id="goldProductsBox">
            <p class="empty-msg">Connecting to live feed…</p>
          </div>
        </article>
      </div>
    </section>

    <!-- RATES SLIDER SECTION -->
    <section class="section" aria-label="Live Rates">
      <div class="section-label">
        <span class="section-title">Live Rates</span>
        <div class="slider-dots" aria-hidden="true" id="ratesDots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="slider-track rates-slider-track" id="ratesSlider">
        <!-- Future Rates -->
        <article class="slider-card rate-card">
          <div class="card-header">
            <h2 class="card-title">Future Rates</h2>
            <span class="live-pill"><span class="live-dot"></span>Live</span>
          </div>
          <div class="table-wrap" id="futureBox">
            <p class="empty-msg">Connecting…</p>
          </div>
        </article>

        <!-- Spot Rates -->
        <article class="slider-card rate-card">
          <div class="card-header">
            <h2 class="card-title">Spot Rates</h2>
            <span class="live-pill"><span class="live-dot"></span>Live</span>
          </div>
          <div class="table-wrap" id="spotBox">
            <p class="empty-msg">Connecting…</p>
          </div>
        </article>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© 2025 Live Bullion. All rates are indicative.</p>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
