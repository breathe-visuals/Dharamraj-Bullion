<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#003336" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dharamraj" />
  <meta name="description" content="Dharamraj Silver Arts – Live gold and silver bullion rates, updated instantly." />

  <title>Dharamraj Silver Arts – Live Rates</title>

  <!-- Icons & Manifest -->
  <link rel="icon" href="Media/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="Media/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="Media/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="Media/apple-touch-icon.png" />
  <link rel="manifest" href="Media/site.webmanifest" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <img src="Media/Dharamraj_Logo-1000x1000.png" alt="Dharamraj Silver Arts" class="header-logo" />
      <div class="header-right">
        <span id="status" class="status-dot" title="Connection status"></span>
        <div id="lastUpdated" class="last-updated">—</div>
      </div>
    </div>
  </header>

  <main class="page">

    <!-- PRODUCT RATES SECTION (No slider, 2 rows) -->
    <section class="section" aria-label="Product Rates">
      <div class="section-label">
        <span class="section-title">Product Rates</span>
      </div>

      <div class="vertical-stack">
        <!-- Silver Card -->
        <article class="rate-card" id="silverCard">
          <div class="card-header">
            <span class="metal-badge silver-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
              Silver Products
            </span>
          </div>
          <div class="table-wrap" id="silverProductsBox">
            <p class="empty-msg">Connecting to live feed…</p>
          </div>
        </article>

        <!-- Gold Card -->
        <article class="rate-card" id="goldCard">
          <div class="card-header">
            <span class="metal-badge gold-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
              Gold Products
            </span>
          </div>
          <div class="table-wrap" id="goldProductsBox">
            <p class="empty-msg">Connecting to live feed…</p>
          </div>
        </article>
      </div>
    </section>

    <!-- MARKET RATES SLIDER -->
    <section class="section" aria-label="Market Rates">
      <div class="section-label">
        <span class="section-title">Market Rates</span>
        <div class="slider-dots" aria-hidden="true">
          <span class="dot active" data-index="0"></span>
          <span class="dot" data-index="1"></span>
        </div>
      </div>

      <div class="slider-track" id="rateSlider">
        <!-- Future Rates -->
        <section class="slider-card" aria-label="Future Rates">
          <div class="card-header">
            <h2 class="card-title">Future Rates</h2>
            <span class="live-pill">
              <span class="live-dot"></span>Live
            </span>
          </div>
          <div class="table-wrap" id="futureBox">
            <p class="empty-msg">Connecting…</p>
          </div>
        </section>

        <!-- Spot Rates -->
        <section class="slider-card" aria-label="Spot Rates">
          <div class="card-header">
            <h2 class="card-title">Spot Rates</h2>
            <span class="live-pill">
              <span class="live-dot"></span>Live
            </span>
          </div>
          <div class="table-wrap" id="spotBox">
            <p class="empty-msg">Connecting…</p>
          </div>
        </section>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© 2025 Dharamraj Silver Arts. All rates are indicative.</p>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
